[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "records_kit"
version = "2.0.0"
description = "Duty-Assistant core: pure-function record engine for 10 types of operation duty records (validate/assemble/rules/trend/lifecycle)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
# 铁律 2/环境假设（docs/design.md §4）：零运行时依赖，标准库仅 tomllib/json/hashlib 等。
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# 声明与手写 Schema 随包分发（design.md §7.1：registry 声明是 payload 唯一权威，
# 协议 Schema 随包）；缺这段时 wheel 里不会带 .toml/.json 数据文件。
[tool.setuptools.package-data]
records_kit = ["protocol/schemas/*.json", "registry/declarations/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
