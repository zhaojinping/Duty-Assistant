# 断路器跳闸记录簿声明草案（M2 前置 · 批1/3 · flat）
# 依据：docs/dsl-gap-list.md 定稿 §1 + §13 拍板（aggregate/reset_ref/keyed-by-device）
# 规则段 TODO 占位——待 M1 引擎接口冻结后转正；格式基准 docs/dsl/README.md

[meta]
record_type = "breaker_trip_record"
title = "断路器跳闸记录簿"
schema_version = "1.5"
layout = "flat"
dedupe_key = ["station", "occurred_minute", "breaker_id"]   # 同分钟同开关多次跳闸需人工区分，暂按分钟+开关（定稿骨架口径）
link_types = []
extra = "reject"
signature_slots = ["记录人"]
action_codes = ["TRACK_BREAKER_TRIP_COUNT", "REPORT_BASELINE_APPROACH"]
escalate_after = 3

[[fields]]
key = "breaker_id"
name = "开关编号"
type = "text"
required = true                     # T3 aggregate 分组键 + 基线查询键（keyed-by-device，§13 拍板）

[[fields]]
key = "protection_action"
name = "保护动作情况"
type = "text"
required = true                     # 自由描述（可能多段），不枚举化（§14 拍板确认保 text）

[[fields]]
key = "reclose_status"
name = "重合闸情况"
type = "enum"
options = ["成功", "不成功", "未投", "拒动"]   # §14 拍板四值；现场口语在壳层映射表归一
required = true

[[fields]]
key = "trip_count"
name = "累计跳闸次数"
type = "number"
decimals = 0
min = 1.0
required = true                     # 人工累计 vs 核心 aggregate 逐年累计双源（GAP-H6）

[[fields]]
key = "weather_note"
name = "天气及异常情况"
type = "text"
required = false

