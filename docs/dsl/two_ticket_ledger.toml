# 两票（工作票/操作票）登记记录簿声明草案（M2 前置 · 批3/3 · flat 建议待确认）
# 依据：docs/dsl-gap-list.md 定稿 §4 + §14 拍板（列9=单票合格评价；E4 分组复位口径确认）
# 规则段 TODO 占位——待 M1 引擎接口冻结后转正；格式基准 docs/dsl/README.md
# 注意：layout 定稿建议由 item_list 改 flat（一行=一票），与主设 §7.4 原标不一致——
#       按定稿建议落 flat，此为声明层确认动作（主设 §7.4 同步修订随 M2）。

[meta]
record_type = "two_ticket_ledger"
title = "两票（工作票/操作票）登记记录簿"
schema_version = "1.5"
layout = "flat"                     # 定稿建议：一行=一票；连续性从 ledger_view 行 fields 取值，与 layout 无关
dedupe_key = ["station", "ticket_kind", "ticket_no"]
link_types = ["references"]         # 被接地线等记录引用（references 入边，本类不外链）
extra = "reject"
signature_slots = ["许可人", "签发人"]
action_codes = ["WARN_TICKET_NO_GAP", "WARN_TICKET_UNCLOSED"]
escalate_after = 3

[[fields]]
key = "ticket_kind"
name = "票种"
type = "enum"
options = ["工作票", "操作票"]
required = true                     # continuity 分组键；复位周期不同（工作票按月/操作票按年，§14 确认）

[[fields]]
key = "ticket_no"
name = "编号"
type = "text"
required = true                     # 编号内序号段解析格式待现场（GAP-E4 仅剩此项）

[[fields]]
key = "task"
name = "工作(操作)任务"
type = "text"
required = true

[[fields]]
key = "person_in_charge"
name = "工作(操作)负责人"
type = "text"
required = true                     # 业务人名（非签字人），入 payload

[[fields]]
key = "start_at"
name = "开始时间"
type = "datetime"
required = true

[[fields]]
key = "end_at"
name = "结束时间"
type = "datetime"
required = false                    # 未终结可空（GAP-H1 条件可空+回填，M1 接口定稿后启用）

[[fields]]
key = "evaluation"
name = "合格评价"
type = "enum"
options = ["合格", "不合格"]        # §14 拍板：单票合格评价进 payload；月度合格率归 aggregate 派生
required = false

