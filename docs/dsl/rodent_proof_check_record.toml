# 防小动物检查记录簿声明草案（M2 前置 · 批2/3 · item_list）
# 依据：docs/dsl-gap-list.md 定稿 §10（一次检查多部位 → 条目=部位）
# 规则段 TODO 占位——待 M1 引擎接口冻结后转正；格式基准 docs/dsl/README.md
# 注：items.key_field 用 spot（同一次检查内部位不重复，可作条目键，不新增模板外逻辑列）

[meta]
record_type = "rodent_proof_check_record"
title = "防小动物检查记录簿"
schema_version = "1.5"
layout = "item_list"                # 一次检查多部位：一行=一部位条目
dedupe_key = ["station", "occurred_day"]
link_types = []
extra = "reject"
signature_slots = ["检查人"]
action_codes = ["REPORT_ISSUE", "URGE_BLOCK_HOLE"]
escalate_after = 3

[items]
key_field = "spot"

[[items.fields]]
key = "spot"
name = "检查部位"
type = "enum"
options = ["配电室", "电缆沟", "挡鼠板", "门窗孔洞"]   # 模板括号自带 4 选项
required = true

[[items.fields]]
key = "issue_found"
name = "发现问题"
type = "text"
required = false                    # 保持 text+空语义（无问题留空/写"无"，定稿决策项口径）；
                                    # 改 tri_bool has_issue 的建议作废，随现场核对定稿

[[items.fields]]
key = "action_taken"
name = "处理措施"
type = "text"
required = false                    # 条件必填（发现非空 → 必填，GAP-H4）——
                                    # required_when 语义待 M1 信封接口定稿后启用

