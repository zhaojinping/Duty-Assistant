# 绝缘测试记录簿声明草案（M2 前置 · 批1/3 · flat）
# 依据：docs/dsl-gap-list.md 定稿 §6 + §14 拍板（极化指数人工报数不增列）
# 规则段 TODO 占位——待 M1 引擎接口冻结后转正；格式基准 docs/dsl/README.md
# 注：两处复合列按定稿 GAP-H3 建议拆分（仪器及电压等级 → instrument_id + test_voltage_kv；
#     环境温湿度 → env_temp + env_humidity），物理列对应关系见定稿 §6

[meta]
record_type = "insulation_test_record"
title = "绝缘测试记录簿"
schema_version = "1.5"
layout = "flat"
dedupe_key = ["station", "occurred_day", "device_name", "test_kind"]
link_types = ["retest_of"]          # 不合格复测挂 retest_of（声明预留）
extra = "reject"
signature_slots = ["试验人"]
action_codes = ["MARK_UNQUALIFIED", "ARRANGE_RETEST"]
escalate_after = 3

[[fields]]
key = "device_name"
name = "设备名称"
type = "text"
required = true

[[fields]]
key = "test_kind"
name = "试验性质"
type = "enum"
options = ["定期", "检修后"]        # 模板括号自带选项
required = true

[[fields]]
key = "r15"
name = "R15s"
type = "number"
unit = "MΩ"
min = 0.0
required = true                     # ratio 分母（除零边界已有测试要求）

[[fields]]
key = "r60"
name = "R60s"
type = "number"
unit = "MΩ"
min = 0.0
required = true

[[fields]]
key = "absorption_ratio"
name = "吸收比"
type = "number"
decimals = 2
required = false                    # =r60/r15 可派生；模板列人工填报 → 双源（GAP-H6）

[[fields]]
key = "polarization_index"
name = "极化指数"
type = "number"
decimals = 2
required = false                    # §14 拍板：人工报数不增列不派生（T1 band，下限数值随现场规程）

[[fields]]
key = "instrument_id"
name = "仪器编号"
type = "text"
required = true                     # 复合列拆分（GAP-H3）

[[fields]]
key = "test_voltage_kv"
name = "试验电压等级"
type = "number"
unit = "kV"
min = 0.0
required = true                     # 复合列拆分（GAP-H3）

[[fields]]
key = "env_temp"
name = "环境温度"
type = "number"
unit = "℃"
required = true                     # 复合列拆分（GAP-H3）；温度换算判限能力开放

[[fields]]
key = "env_humidity"
name = "环境湿度"
type = "number"
unit = "%RH"
min = 0.0
max = 100.0
required = true                     # 复合列拆分（GAP-H3）

[[fields]]
key = "conclusion"
name = "结论"
type = "enum"
options = ["合格", "不合格"]        # 建议集；选项集待现场定（§14 未拍）
required = true

