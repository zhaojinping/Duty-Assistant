# 避雷器动作记录簿声明草案（M2 前置样例 1/2 · flat）
# 依据：docs/dsl-gap-list.md 定稿 §2（字段表）+ §14 拍板结果
# 注意：[[rules]] 段为 TODO 占位——待 M1 引擎接口冻结后按 §7.3 DSL 统一补齐
# 格式基准：docs/design.md §7.2（蓄电池示例）

[meta]
record_type = "surge_arrester_action_record"
title = "避雷器动作记录簿"
schema_version = "1.5"
layout = "flat"                     # 横表台账：一行 = 一次动作
dedupe_key = ["station", "occurred_day", "phase", "install_location", "counter_reading"]
link_types = []                     # 暂无跨记录关系
extra = "reject"
signature_slots = ["记录人"]
action_codes = ["REPORT_NON_STORM_ACTION", "CHECK_COUNTER_ABNORMAL"]
escalate_after = 3

[[fields]]
key = "phase"
name = "相别"
type = "enum"
options = ["A", "B", "C"]
required = true

[[fields]]
key = "install_location"
name = "安装位置"
type = "enum"
options = ["线路侧", "母线侧"]
required = true

[[fields]]
key = "counter_reading"
name = "计数器累计读数"
type = "number"
decimals = 0
min = 0.0
required = true

[[fields]]
key = "action_current"
name = "动作电流"
type = "number"
unit = "kA"
min = 0.0                           # 上限限值待现场规程（§14）
required = false

[[fields]]
key = "weather"
name = "天气"
type = "enum"
options = ["雷雨", "操作过电压", "大风", "冰雹", "冰雪", "其他"]   # §14 拍板六值
required = true                     # 动作必记天气（§14 拍板）

