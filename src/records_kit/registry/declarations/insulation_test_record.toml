# 绝缘测试记录簿声明（M2 转正批2 · flat）
# 转正自 docs/dsl/insulation_test_record.toml（依据 docs/dsl-gap-list.md 定稿 §6 + §14 拍板）
# 说明：两处复合列按定稿 GAP-H3 建议拆分（仪器及电压等级 → instrument_id + test_voltage_kv；
#       环境温湿度 → env_temp + env_humidity）。限值/比值带数值均待现场规程核对（§14），
#       不虚构、不转正，TODO 注释保留；极化指数按 §14 拍板为人工报数（不派生）。

[meta]
record_type = "insulation_test_record"
title = "绝缘测试记录簿"
schema_version = "1.5"
layout = "flat"                      # 横表台账：一行 = 一台设备一次试验
dedupe_key = ["station", "occurred_day", "device_name", "test_kind"]
link_types = ["retest_of"]           # 不合格复测挂 retest_of（复测链落点）
extra = "reject"                     # 未知字段默认拒绝
signature_slots = ["试验人"]          # 只读留白，人签（铁律 7）
action_codes = ["MARK_UNQUALIFIED", "ARRANGE_RETEST"]
escalate_after = 3

# ---- 记录级字段：模板 11 列（试验日期进 occurred_at、试验人进签名槽，其余 9 列）----

[[fields]]
key = "device_name"
name = "设备名称"
type = "text"
required = true                      # dedupe_key 成员

[[fields]]
key = "test_kind"
name = "试验性质"
type = "enum"
options = ["定期", "检修后"]         # 模板括号自带选项
required = true                      # dedupe_key 成员

[[fields]]
key = "r15"
name = "R15s"
type = "number"
unit = "MΩ"
min = 0.0
required = true                      # ratio 分母（除零边界已有测试要求）

[[fields]]
key = "r60"
name = "R60s"
type = "number"
unit = "MΩ"
min = 0.0
required = true

[[fields]]
key = "absorption_ratio"
name = "吸收比"
type = "number"
decimals = 2
required = false                     # =r60/r15 可派生；模板列人工填报 → 双源（GAP-H6）

[[fields]]
key = "polarization_index"
name = "极化指数"
type = "number"
decimals = 2
required = false                     # §14 拍板：人工报数、不增列不派生（T1 band，下限随现场规程）

[[fields]]
key = "instrument_id"
name = "仪器编号"
type = "text"
required = true                      # 复合列拆分（GAP-H3）

[[fields]]
key = "test_voltage_kv"
name = "试验电压等级"
type = "number"
unit = "kV"
min = 0.0
required = true                      # 复合列拆分（GAP-H3）

[[fields]]
key = "env_temp"
name = "环境温度"
type = "number"
unit = "℃"
required = true                      # 复合列拆分（GAP-H3）；温度换算判限能力开放

[[fields]]
key = "env_humidity"
name = "环境湿度"
type = "number"
unit = "%RH"
min = 0.0
max = 100.0
required = true                      # 复合列拆分（GAP-H3）

[[fields]]
key = "conclusion"
name = "结论"
type = "enum"
options = ["合格", "不合格"]         # 建议集；选项集待现场定（§14 未拍，随现场核对）
required = true

