# 避雷器动作记录簿声明（M2 转正批1 · flat）
# 转正自 docs/dsl/surge_arrester_action_record.toml（依据 docs/dsl-gap-list.md 定稿 §2 + §13/§14 拍板）
# 说明：字段段按模板逐列落成；限值数值待现场规程核对者不虚构、不入 [[rules]]（TODO 注释保留）。
#       when 否定文法（GAP-C1）与跨记录单调算子（GAP-A3）随引擎扩展后转正。

[meta]
record_type = "surge_arrester_action_record"
title = "避雷器动作记录簿"
schema_version = "1.5"
layout = "flat"                      # 横表台账：一行 = 一次动作
dedupe_key = ["station", "occurred_day", "phase", "install_location", "counter_reading"]
link_types = []                      # 暂无跨记录关系
extra = "reject"                     # 未知字段默认拒绝
signature_slots = ["记录人"]          # 只读留白，人签（铁律 7）
action_codes = ["REPORT_NON_STORM_ACTION", "CHECK_COUNTER_ABNORMAL"]
escalate_after = 3

# ---- 记录级字段：模板 7 列（动作时间进 occurred_at、记录人进签名槽，其余 5 列）----

[[fields]]
key = "phase"
name = "相别"
type = "enum"
options = ["A", "B", "C"]            # 模板括号自带选项
required = true

[[fields]]
key = "install_location"
name = "安装位置"
type = "enum"
options = ["线路侧", "母线侧"]        # 模板括号自带选项
required = true

[[fields]]
key = "counter_reading"
name = "计数器累计读数"
type = "number"
decimals = 0
min = 0.0
required = true                      # 跨记录单调不减核对（GAP-A3）的取数源

[[fields]]
key = "action_current"
name = "动作电流"
type = "number"
unit = "kA"
min = 0.0                            # 上限限值待现场规程（§14）
required = false

[[fields]]
key = "weather"
name = "天气"
type = "enum"
options = ["雷雨", "操作过电压", "大风", "冰雹", "冰雪", "其他"]   # §14 拍板六值
required = true                      # §14 拍板：动作必记天气

# ---- 规则段：周期规则不进 create/confirm 流水线，唯一出口是探针（§7.3 豁免注）----

[[rules]]
id = "counter_check"
kind = "cycle"
tier = 1                             # 固定 1：归层原则约束的是 create/confirm 流水线
expr = "monthly"                     # 每月核对计数器底数（模板脚注明示，为周期值出处）
# cycle_baseline：missing 判定起算日，待现场规程核对（主设 §12）

# ---- 非雷雨天气动作（GAP-C1，脚注：非雷雨天气动作应检查上报）----
# 条件型规则（dsl-grammar-ext-proposal §4）：when 命中 → violation；未命中 → pass（始终出条目）。

[[rules]]
id = "non_storm_action"
kind = "condition"
tier = 1                             # when 只读本记录 payload
when = { weather = "not_in:雷雨" }   # when 值侧前缀微文法（主控拍板）
level = "warn"
action = "REPORT_NON_STORM_ACTION"

# ---- 计数器累计读数单调核对（GAP-A3，脚注：每月核对计数器底数）----
# T3 跨记录单调（proposal §5）：本次 ≥ 前值 → pass；倒退 → violation（换表归零属业务合法
# 倒退，如实判违规由现场志记处理，§5.5 不引入隐式复位）。分组隔离：同相别+安装位置互比。

[[rules]]
id = "counter_monotonic"
kind = "limit"
tier = 3
expr = "monotonic:counter_reading,key=phase+install_location,op=ge"
level = "warn"
action = "CHECK_COUNTER_ABNORMAL"
