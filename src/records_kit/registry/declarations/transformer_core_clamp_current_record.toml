# 主变铁芯/夹件接地电流测试记录簿声明（M2 转正批2 · flat）
# 转正自 docs/dsl/transformer_core_clamp_current_record.toml（依据 docs/dsl-gap-list.md 定稿 §8 + §14 拍板）
# 说明：字段段按模板逐列落成；电流上限限值数值待现场规程核对（§14），不虚构、不转正；
#       trend 的 drop_warn 口径/比较基准/阈值属主设 §12 待定，trend 段留 TODO。

[meta]
record_type = "transformer_core_clamp_current_record"
title = "主变铁芯/夹件接地电流测试记录簿"
schema_version = "1.5"
layout = "flat"                      # 横表台账：一行 = 一台主变一次测试
dedupe_key = ["station", "occurred_day", "transformer_id"]
link_types = []                      # 暂无跨记录关系
extra = "reject"                     # 未知字段默认拒绝
signature_slots = ["测试人"]          # 只读留白，人签（铁律 7）
action_codes = ["CHECK_CORE_CURRENT_ABNORMAL", "ARRANGE_OUTAGE_INSPECTION"]
escalate_after = 3

# ---- 记录级字段：模板 8 列（测试日期进 occurred_at、测试人进签名槽，其余 6 列）----

[[fields]]
key = "transformer_id"
name = "主变编号"
type = "text"
required = true                      # dedupe_key 成员 + trend 分组键

[[fields]]
key = "core_current"
name = "铁芯接地电流"
type = "number"
unit = "mA"
min = 0.0                            # 上限限值待现场规程（§14）
required = true

[[fields]]
key = "clamp_current"
name = "夹件接地电流"
type = "number"
unit = "mA"
min = 0.0                            # 上限限值待现场规程（§14）
required = true

[[fields]]
key = "load_condition"
name = "负荷情况"
type = "number"
unit = "%"
min = 0.0
max = 100.0
required = false                     # §14 拍板：改数值型（负荷率 %），原文字/枚举口径作废

[[fields]]
key = "vs_last_note"
name = "与上次对比"
type = "text"
required = false                     # 人工版趋势结论，与 trend 判定双源（GAP-H6）

[[fields]]
key = "conclusion"
name = "结论"
type = "enum"
options = ["正常", "异常"]           # 建议集；选项集待现场定（§14 未拍，随现场核对）
required = true

# ---- 规则段：周期规则不进 create/confirm 流水线，唯一出口是探针（§7.3 豁免注）----

[[rules]]
id = "cycle_periodic"
kind = "cycle"
tier = 1                             # 固定 1：归层原则约束的是 create/confirm 流水线
expr = "periodic:30d"                # 每月一次（制度出处：汇编2023版六·定期试验、轮换设备表 序 6）
# cycle_baseline：missing 判定起算日，待现场规程核对（主设 §12）

# ---- 未转正规则（TODO：待限值数值/引擎能力落定，见 docs/dsl/ 草案同段）----
# TODO rules:
#   - id: current_limit              # kind=limit / tier=1
#     expr: lte:上限 ×2（core_current / clamp_current）   # 数值待现场（§14）
#     action: CHECK_CORE_CURRENT_ABNORMAL
#   - id: current_trend              # trend：source=core_current / clamp_current，按 transformer_id 序列
#     drop_warn 口径、比较基准、阈值均属主设 §12 待定    # 与 vs_last_note 双源核对（GAP-H6，算子待 M2）
