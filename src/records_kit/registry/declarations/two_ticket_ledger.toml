# 两票（工作票/操作票）登记记录簿声明（M2 转正批3 · flat）
# 转正自 docs/dsl/two_ticket_ledger.toml（依据 docs/dsl-gap-list.md 定稿 §4 + §14 拍板）
# 说明：layout 按定稿建议落 flat（一行=一票）；E4 复位周期差异（工作票按月/操作票按年）
#       用 when 区分的双 continuity 规则表达（#20 冻结文法的 reset 为单值，双规则各管一票种）；
#       ticket_duration_check 时长限值 Nd 待现场，TODO 保留。

[meta]
record_type = "two_ticket_ledger"
title = "两票（工作票/操作票）登记记录簿"
schema_version = "1.5"
layout = "flat"                     # 定稿建议：一行=一票
dedupe_key = ["station", "ticket_kind", "ticket_no"]
link_types = ["references"]         # 被接地线等记录引用（references 入边，本类不外链）
extra = "reject"
signature_slots = ["许可人", "签发人"]
action_codes = ["WARN_TICKET_NO_GAP", "WARN_TICKET_UNCLOSED"]
escalate_after = 3

[[fields]]
key = "ticket_kind"
name = "票种"
type = "enum"
options = ["工作票", "操作票"]
required = true                     # continuity 分组键

[[fields]]
key = "ticket_no"
name = "编号"
type = "text"
required = true                     # 编号内序号段解析格式待现场（GAP-E4 仅剩此项）

[[fields]]
key = "task"
name = "工作(操作)任务"
type = "text"
required = true

[[fields]]
key = "person_in_charge"
name = "工作(操作)负责人"
type = "text"
required = true                     # 业务人名（非签字人），入 payload

[[fields]]
key = "start_at"
name = "开始时间"
type = "datetime"
required = true

[[fields]]
key = "end_at"
name = "结束时间"
type = "datetime"
required = false                    # 未终结可空（GAP-H1 条件可空+回填，接口定稿后启用）

[[fields]]
key = "evaluation"
name = "合格评价"
type = "enum"
options = ["合格", "不合格"]        # §14 拍板：单票合格评价进 payload；月度合格率归 aggregate 派生
required = false

# ---- 规则段：#20 冻结文法转正（E4：工作票按月/操作票按年，when 区分双规则）----

[[rules]]
id = "ticket_continuity_monthly"
kind = "limit"
tier = 3                            # T3 台账编号连续性（工作票）
expr = "continuity:ticket_no,group=ticket_kind,reset=monthly"
when = { ticket_kind = "工作票" }
level = "alarm"
action = "WARN_TICKET_NO_GAP"

[[rules]]
id = "ticket_continuity_yearly"
kind = "limit"
tier = 3                            # T3 台账编号连续性（操作票）
expr = "continuity:ticket_no,group=ticket_kind,reset=yearly"
when = { ticket_kind = "操作票" }
level = "alarm"
action = "WARN_TICKET_NO_GAP"

# ---- 待现场项（TODO 保留，勿虚构数值）----
