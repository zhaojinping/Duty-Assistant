# 无周期（事件触发型）。归档口径：保存期一年（操作票按年装订/工作票按月装订，封面统计数字，
# 出处汇编2023版 §6.2.2/§6.3.1）——属壳层归档策略，不入声明。
# 注：本表无独立"登记时间"列——occurred_at 口径=壳层登记时刻，业务时间用 start_at 表达（定稿注）。
