#   - id: recover_in_time
#     kind = "limit" / tier = 3
#     expr = "recovery_within:Nd,key=device_id+function"   # 恢复时限 Nd 待现场（GAP-H1/E2）
#     action = "WARN_RECOVER_OVERDUE"
# ---- 周期段 ----
# 无周期（事件触发型）。脚注"纳入交接班交代"属交接班流程，不在本包范围。
