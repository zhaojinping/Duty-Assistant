# 接地线装拆记录簿声明（M2 转正批2 · flat，案 B）
# 转正自 docs/dsl/grounding_wire_record.toml（依据 docs/dsl-gap-list.md 定稿 §3 + §13 拍板）
# 说明：dedupe_key 的 occurred_minute 修正为 occurred_at（registry 派生键仅支持
#       station/occurred_day/occurred_at，同批1 跳闸口径）；pairing 规则按 #20 冻结文法转正
#       （动作判别引擎内置：装设=占用/拆除=释放）；remove_overdue（GAP-E5）时限 Nd 待现场，TODO 保留。

[meta]
record_type = "grounding_wire_record"
title = "接地线装拆记录簿"
schema_version = "1.5"
layout = "flat"                     # §13 拍板案 B：一行=一动作，装/拆跨记录配对
dedupe_key = ["station", "occurred_at", "wire_id", "action"]
link_types = ["references"]         # 命令来源挂工作票/操作票（references → two_ticket_ledger）
extra = "reject"
signature_slots = ["操作人", "监护人"]
action_codes = ["WARN_WIRE_DANGLING", "WARN_WIRE_REOCCUPY", "WARN_REMOVE_OVERDUE"]
escalate_after = 3

[[fields]]
key = "action"
name = "类别"
type = "enum"
options = ["装设", "拆除"]          # 模板括号自带；pairing 类型判别
required = true

[[fields]]
key = "wire_id"
name = "接地线编号"
type = "text"
required = true                     # pairing 配对键

[[fields]]
key = "location"
name = "装设地点(设备编号)"
type = "text"
required = true                     # 拆除行是否强制与装设一致 → 条件必填细节（GAP-H2），待接口定稿后启用

[[fields]]
key = "order_ref"
name = "命令来源(令号/票号)"
type = "text"
required = true                     # links references → 两票；"拆除超时"取数链路（GAP-E5）

# ---- 规则段：#20 冻结文法转正 ----

[[rules]]
id = "wire_pairing"
kind = "limit"
tier = 3                            # T3 跨记录配对（§13 案 B）
expr = "pairing:grounding,key=wire_id"
level = "warn"                      # 重复占用/悬空拆除均 warn；悬空占用半边归周期探针 detail

