# 蓄电池电压测试记录簿声明（M1 参照类，全链实现）
# 依据：docs/design.md §7.2 样例 + docs/dsl-gap-list.md 定稿 §7（逐列映射）与 §13/§14 拍板结果
# 说明：字段段按模板逐列落成；限值数值来自主设样例，标「待现场」者为现场规程核对项，
#       本声明不虚构业务数值。
# 载体：随包分发的声明目录（registry/declarations）；docs/dsl/ 下为 M2 其余九类草案。

[meta]
record_type = "battery_voltage_test"
title = "蓄电池电压测试记录簿"
schema_version = "1.5"
layout = "item_list"                 # 表单式：顶部记录级字段 + 下方逐只条目
dedupe_key = ["station", "occurred_day", "test_kind", "dc_system_id"]   # dc_system_id：同日同站多组测试判重隔离（2026-09-21 拍板）
link_types = ["retest_of"]           # 复测值列的复测链落点
extra = "reject"                     # 未知字段默认拒绝
signature_slots = []                  # 免签类型（2026-09-21 定案）：零签认 confirm，提交后服务自动定稿；签名能力保留其他类型
action_codes = ["MARK_LAGGING_CELL", "RETEST_CELL"]
escalate_after = 3

# ---- 记录级字段：模板顶部 7 项（测试日期进 occurred_at、测试人进签名槽，其余 5 项）----

[[fields]]
key = "dc_system_id"
name = "直流系统编号"
type = "text"
required = true

[[fields]]
key = "float_voltage"
name = "浮充电压"
type = "number"
unit = "V"
min = 0.0
max = 300.0                          # 物理边界；浮充电压带限值待现场（§14）
required = true

[[fields]]
key = "float_current"
name = "浮充电流"
type = "number"
unit = "A"
min = 0.0
required = false                     # 缺口清单 §7 增补列（模板实有、主设样例未列）

[[fields]]
key = "env_temp"
name = "环境温度"
type = "number"
unit = "℃"
required = false

[[fields]]
key = "test_kind"
name = "测试性质"
type = "enum"
options = ["定期", "核对性放电"]
required = true                      # dedupe_key 成员 + 周期规则 when

# ---- 条目容器：逐只单体（模板预填序号 1–20，按实际数量增删）----

[items]
key_field = "cell_no"
min_items = 1                        # GAP-H7：条目下限 1 + key_field 去重由引擎实施

[[items.fields]]
key = "cell_no"
name = "电池序号"
type = "number"
decimals = 0
required = true

[[items.fields]]
key = "voltage"
name = "单体电压"
type = "number"
unit = "V"
min = 0.0
max = 15.0
required = true

[[items.fields]]
key = "lagging"
name = "是否落后电池"
type = "tri_bool"
required = false                     # GAP-H6：人工勾选与核心派生并存，双源一致性核对随 M2

[[items.fields]]
key = "remark"
name = "备注"
type = "text"
required = false

[[items.fields]]
key = "retest_voltage"
name = "复测值"
type = "number"
unit = "V"
min = 0.0
max = 15.0
required = false                     # 缺口清单 §7 增补列；复测链走 retest_of 成对关系

# ---- 规则段：周期规则不进 create/confirm 流水线，唯一出口是探针（§7.3 豁免注）----

[[rules]]
id = "cycle_regular"
kind = "cycle"
tier = 1                             # 固定 1：归层原则约束的是 create/confirm 流水线
expr = "periodic:30d"                # 每月一次（制度汇编六·定期试验、轮换设备表 序 3）
when = { test_kind = "定期" }
# cycle_baseline：missing 判定起算日，待现场规程核对（主设 §12）

[[rules]]
id = "voltage_band"
kind = "limit"
tier = 1
target = "items.voltage"
expr = "band:1.85,2.35"              # 默认口径（2V 单体，2026-09-21 定案）；12V 组由部署配置注入覆盖（11.85–13.80）
level = "warn"

[[rules]]
id = "lagging_detect"
kind = "limit"
tier = 2                             # 表内派生：单只电压与全组均值比较
target = "items.voltage"
expr = "deviation:mean,5%"
level = "alarm"
action = "MARK_LAGGING_CELL"

# ---- 趋势段：单体最低电压的逐月序列 ----

[[trend]]
metric = "cell_voltage_min"
source = "min(items.voltage)"
window = 6                           # 6 个点（含当前记录）
drop_warn = 0.10                     # 相对降幅阈值（口径见 engine/trend.py 的 M1 默认）
